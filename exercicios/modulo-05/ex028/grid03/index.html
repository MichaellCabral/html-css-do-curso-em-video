<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <h1>Grid automático</h1>
    <p>Propriedade Grid auto: pode ser row ou column</p>
    <p>Esta propriedade permite que o grid crie linhas ou colunas no tamanho de pixels desejado</p>

    <h2>Exemplo de grid automático quebrando linhas</h2>
    <div class="containerrow">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>

    <h2>Exemplo de grid automático quebrando colunas</h2>
    <div class="containercolumn">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>

</body>
</html>
