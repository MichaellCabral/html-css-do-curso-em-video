    <h1>Flexible Box</h1>
    <h2>Order</h2>
    <p>Se aplica à propriedade "order" dos itens dentro do contêiner flexível ordenando-os.</p>
    <p>a propriedade "flex: auto;" é aplicada somente aos itens e não ao conteiner, neste exemplo tiramos esta propriedade.</p>
    

    <div class="conteiner">
        <div class="item"id="i1">A</div>
        <div class="item"id="i2">B</div>
        <div class="item"id="i3">C</div>
        <div class="item"id="i4">D</div>
        <div class="item"id="i5">E</div>
        <div class="item"id="i6">F</div>
        <div class="item"id="i7">G</div>
    </div>
